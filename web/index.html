<!DOCTYPE html>
<html>
<head>
    <base href="$FLUTTER_BASE_HREF">

    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">

    <!-- 🌟 1. 이 부분들을 지은 님 앱에 맞게 수정합니다! (검색엔진, 카톡 공유 시 나타남) -->
    <meta name="description" content="우리들의 프라이빗 모임 & 만남 기록, 모락(Morak) ☁️">
    <meta name="keywords" content="모임, 일정, 사진첩, 커뮤니티, 모락">

    <!-- iOS 홈 화면에 추가할 때 아이콘 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="모락">
    <link rel="apple-touch-icon" href="icons/Icon-192.png">

    <!-- 파비콘 (브라우저 탭 아이콘) -->
    <link rel="icon" type="image/png" href="favicon.png"/>

    <!-- 🌟 2. 탭에 표시될 이름! -->
    <title>모락(Morak)</title>
    <link rel="manifest" href="manifest.json">

    <!-- 🚨 절대 지우면 안 되는 플러터 핵심 스크립트 🚨 -->
    <script>
        window.addEventListener('load', function(ev) {
          // 플러터 앱을 로드하고 실행하는 스크립트
          _flutter.loader.loadEntrypoint({
            serviceWorker: {
              serviceWorkerVersion: serviceWorkerVersion,
            },
            onEntrypointLoaded: function(engineInitializer) {
              engineInitializer.initializeEngine().then(function(appRunner) {
                appRunner.runApp();
              });
            }
          });
        });
    </script>
</head>
<body>
<!-- 여기에 로딩 스피너 같은 CSS 애니메이션을 넣기도 하는데, 지금은 비워둬도 앱은 정상 작동합니다! -->
<script src="flutter_bootstrap.js" async></script>
</body>
</html>
